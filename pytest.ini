[pytest]
markers =
    api: tests that require GOOGLE_API_KEY (hit the embedding API)
    regression: full-engine regression check via TestClient (opt-in, ~30-45 min via `pytest -m regression`)

# Exclude the Archive folder — pre-refactor scripts and stale test files
# that no longer import cleanly. See .gitignore for the corresponding
# git exclusion.
norecursedirs = Archive .git .venv venv node_modules
